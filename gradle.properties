# ===================================
# Gradle Performance Optimizations
# ===================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true


# ===================================
# Kotlin Compilation Optimizations
# ===================================
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
kotlin.compiler.execution.strategy=in-process

# ===================================
# Android Build Optimizations
# ===================================
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# R8 Optimizations
android.enableR8.fullMode=true

# Disable default build features (enable only what you need)
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ===================================
# Resource Optimization
# ===================================
android.experimental.enableResourceOptimizations=true

# ===================================
# Dependency Resolution
# ===================================
android.dependencyResolutionAtConfigurationTime.disallow=false